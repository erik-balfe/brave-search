name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (bun check)
        run: bun check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Check packed contents
        run: bun pm pack --dry-run

      - name: Audit dependencies
        run: bun audit || (echo "audit found advisories"; exit 1)
