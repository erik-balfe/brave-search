name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (bun check)
        run: bun check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # A build that exports nothing from the CJS entry is silent otherwise:
      # require() returns an empty object and consumers get undefined.
      - name: Smoke test both entry points
        run: |
          node -e "const m=require('./dist/cjs/index.js'); if(typeof m.BraveSearch!=='function'){throw new Error('CJS entry exports no BraveSearch')}; console.log('cjs keys:', Object.keys(m).length)"
          node --input-type=module -e "import('./dist/esm/index.js').then(m=>{if(typeof m.BraveSearch!=='function')throw new Error('ESM entry exports no BraveSearch'); console.log('esm keys:', Object.keys(m).length)})"

      - name: Check packed contents
        run: bun pm pack --dry-run

      - name: Audit dependencies
        run: bun audit || (echo "audit found advisories"; exit 1)
